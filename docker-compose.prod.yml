services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invision
      POSTGRES_USER: invision
      POSTGRES_PASSWORD: invision
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invision -d invision"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8090:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://invision:invision@postgres:5432/invision
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: http://51.195.200.207:8443/v1
    volumes:
      - ./ml/model:/app/ml/model:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
